import groovy.json.JsonOutput

import java.nio.charset.StandardCharsets
import java.util.concurrent.ThreadLocalRandom
import org.gradle.jvm.toolchain.JavaLanguageVersion
import org.gradle.jvm.toolchain.JavaToolchainService

def javaToolchains = project.extensions.getByType(JavaToolchainService)

def getJavaLauncher = { int version ->
    javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(version)
    }
}

// ---------------------------------------------------------------------------
// Server type selection: ./gradlew runServerV1_21 -PserverType=bukkit
// Options: paper (default), spigot, bukkit
//
// Paper jars are downloaded prebuilt. Spigot and Bukkit (CraftBukkit) are NOT
// available as prebuilt downloads (Mojang's EULA forbids redistributing
// patched/decompiled server code), so those are built locally with
// BuildTools.jar the first time they're requested. That first build can take
// several minutes per Minecraft version and requires Git to be on PATH.
// ---------------------------------------------------------------------------
def serverType = (project.hasProperty('serverType') ? project.property('serverType') : 'paper').toString().toLowerCase()
if (!(serverType in ['paper', 'spigot', 'bukkit'])) {
    throw new GradleException("Invalid serverType '${serverType}'. Must be 'paper', 'spigot', or 'bukkit'. Pass with -PserverType=<type>")
}
println "Server type selected: ${serverType}"

// Per-version config: MC version, Java version needed to build/run it, and Paper download info.
def serverConfigs = [
        'v1_8' : [
                mcVersion  : '1.8.8',
                javaVersion: 8,
                paper      : [
                        build: '445',
                        url  : 'https://fill-data.papermc.io/v1/objects/7ff6d2cec671ef0d95b3723b5c92890118fb882d73b7f8fa0a2cd31d97c55f86/paper-1.8.8-445.jar'
                ]
        ],
        'v1_17': [
                mcVersion  : '1.17.1',
                javaVersion: 17,
                paper      : [
                        build: '394',
                        url  : 'https://fill-data.papermc.io/v1/objects/6cc1ee2f94253ce10b5374ed85fffc735a97d8f1b64db293683dfa24dd3cc05f/paper-1.17.1-411.jar'
                ]
        ],
        'v1_21': [
                mcVersion  : '1.21.8',
                javaVersion: 21,
                paper      : [
                        build: '58',
                        url  : 'https://fill-data.papermc.io/v1/objects/d2f29b6d3c945479de8271ea56e8f7935fceec021edaafcbbaf2a8c09f4a5d67/paper-1.21.8-58.jar'
                ]
        ]
]

// Returns the test server directory for the selected server type.
// Examples:
//  build/test-server-1.8-paper
//  build/test-server-1.8-spigot
//  build/test-server-1.8-bukkit
def getTestServerDir = { String key ->
    def cfg = serverConfigs[key]
    file("$buildDir/test-server-${cfg.mcVersion}-${serverType}")
}

// ---------------------------------------------------------------------------
// Paper: prebuilt jars, downloaded directly
// ---------------------------------------------------------------------------
serverConfigs.each { key, cfg ->
    def dir = getTestServerDir(key)
    tasks.register("downloadPaperServer${key.capitalize()}") {
        outputs.file file("$dir/paper.jar")
        doLast {
            dir.mkdirs()
            def paperJar = file("$dir/paper.jar")
            if (!paperJar.exists()) {
                println "Downloading Paper ${cfg.mcVersion}..."
                new URL(cfg.paper.url).withInputStream { i -> paperJar.withOutputStream { it << i } }
            }
        }
    }
}

// ---------------------------------------------------------------------------
// Spigot / CraftBukkit (Bukkit): built locally via BuildTools
// ---------------------------------------------------------------------------
def buildToolsJar = file("$buildDir/buildtools/BuildTools.jar")

tasks.register('downloadBuildTools') {
    outputs.file buildToolsJar
    doLast {
        buildToolsJar.parentFile.mkdirs()
        if (!buildToolsJar.exists()) {
            println "Downloading BuildTools..."
            new URL('https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar')
                    .withInputStream { i -> buildToolsJar.withOutputStream { it << i } }
        }
    }
}

serverConfigs.each { key, cfg ->
    def buildToolsOutputDir = file("$buildDir/buildtools/$key")
    def craftbukkitJar = file("$buildToolsOutputDir/craftbukkit-${cfg.mcVersion}.jar")
    def spigotJar = file("$buildToolsOutputDir/spigot-${cfg.mcVersion}.jar")

    tasks.register("buildSpigotBukkit${key.capitalize()}", Exec) {
        dependsOn tasks.named('downloadBuildTools')
        outputs.files craftbukkitJar, spigotJar
        onlyIf { !craftbukkitJar.exists() || !spigotJar.exists() }

        doFirst {
            buildToolsOutputDir.mkdirs()

            executable = getJavaLauncher(cfg.javaVersion)
                    .get()
                    .executablePath
                    .asFile
                    .absolutePath

            commandLine(
                    executable,
                    '-jar',
                    buildToolsJar.absolutePath,
                    '--rev',
                    cfg.mcVersion,
                    '--output-dir',
                    buildToolsOutputDir.absolutePath,
                    '--compile',
                    'craftbukkit,spigot'
            )
        }

        workingDir buildToolsOutputDir
    }
}

// Resolves which task produces the jar for the currently selected serverType,
// and where that jar ends up on disk.
def resolveServerJarInfo = { String key ->
    def cfg = serverConfigs[key]
    def buildToolsOutputDir = file("$buildDir/buildtools/$key")
    switch (serverType) {
        case 'paper':
            return [
                    task: tasks.named("downloadPaperServer${key.capitalize()}"),
                    jar: new File(getTestServerDir(key), "paper.jar")
            ]
        case 'spigot':
            return [
                    task: tasks.named("buildSpigotBukkit${key.capitalize()}"),
                    jar: new File(buildToolsOutputDir, "spigot-${cfg.mcVersion}.jar")
            ]
        case 'bukkit':
            return [
                    task: tasks.named("buildSpigotBukkit${key.capitalize()}"),
                    jar: new File(buildToolsOutputDir, "craftbukkit-${cfg.mcVersion}.jar")
            ]
    }
}

// ---------------------------------------------------------------------------
// Setup and run tasks for each server version, using the selected serverType
// ---------------------------------------------------------------------------
serverConfigs.each { key, cfg ->
    def dir = getTestServerDir(key)
    def jarInfo = resolveServerJarInfo(key)

    tasks.register("setupServer${key.capitalize()}") {
        dependsOn tasks.named('shadowAllVersions'), jarInfo.task
        doLast {
            dir.mkdirs()
            file("$dir/eula.txt").text = 'eula=true'
            def props = file("$dir/server.properties")
            if (!props.exists()) {
                props.text = 'online-mode=false\n'
            }

            copy {
                from jarInfo.jar
                into dir
                rename { 'server.jar' }
            }

            copy {
                from tasks.named('shadowAllVersions').get().archiveFile
                into "$dir/plugins"
            }

            def playerName = "TheRealKushi"

            def offlineUuid = UUID.nameUUIDFromBytes(
                    ("OfflinePlayer:" + playerName)
                            .getBytes(StandardCharsets.UTF_8)
            )

            def opsFile = file("$dir/ops.json")

            opsFile.text = JsonOutput.prettyPrint(
                    JsonOutput.toJson([
                            [
                                    uuid: offlineUuid.toString(),
                                    name: playerName,
                                    level: 4,
                                    bypassesPlayerLimit: false
                            ]
                    ])
            )
        }
    }

    tasks.register("runServer${key.capitalize()}", Exec) {
        dependsOn tasks.named("setupServer${key.capitalize()}")
        workingDir dir

        doFirst {
            def jvmArgs = ['-Xmx4G']
            if (serverType == 'paper') {
                jvmArgs << '-Dpaper.debug=true'
            }

            def executable = getJavaLauncher(cfg.javaVersion)
                    .get()
                    .executablePath
                    .asFile
                    .absolutePath

            commandLine(
                    [executable] +
                            jvmArgs +
                            ['-jar', 'server.jar']
            )
        }
    }
}

// Where to store vanilla clients
def vanillaClientV1_17 = file("$buildDir/mc-client-1.17.1.jar")
def vanillaClientV1_21 = file("$buildDir/mc-client-1.21.8.jar")

// Where assets are stored
def assetsDir = file("$buildDir/assets")

tasks.register('copyClientV1_17') {
    outputs.file vanillaClientV1_17
    doLast {
        copy {
            from 'libs/1.17.1.jar'
            into vanillaClientV1_17.parentFile
            rename { vanillaClientV1_17.name }
        }
    }
}

tasks.register('copyClientV1_21') {
    outputs.file vanillaClientV1_21
    doLast {
        copy {
            from 'libs/minecraft-1.21.8.jar'
            into vanillaClientV1_21.parentFile
            rename { vanillaClientV1_21.name }
        }
    }
}

// Helper to randomize offline names
static def randomPlayerName() {
    return "Player" + ThreadLocalRandom.current().nextInt(100, 1000)
}

// Multiple clients at once: gradlew runClients -Pclients=3
def numClients = (project.hasProperty("clients") ? project.property("clients").toInteger() : 1)

// --- 1.17 clients ---
def runClientTasksV1_17 = (1..numClients).collect { i ->
    tasks.register("runClientV1_17_$i", JavaExec) {
        dependsOn 'copyClientV1_17'
        group = 'minecraft'
        description = "Launch vanilla client 1.17.1 #$i"
        mainClass = 'net.minecraft.client.main.Main'
        classpath = files(vanillaClientV1_17)
        def playerName = randomPlayerName()
        args '--username', playerName,
                '--version', '1.17.1',
                '--accessToken', '0',
                '--gameDir', file("$buildDir/testclient-1.17-$i"),
                '--assetsDir', assetsDir,
                '--width', '854', '--height', '480',
                '--server', '127.0.0.1', '--port', '25565'
        jvmArgs '-Xmx1G'
    }
}

tasks.register('runClientsV1_17') {
    dependsOn runClientTasksV1_17
}

// --- 1.21 clients ---
def runClientTasksV1_21 = (1..numClients).collect { i ->
    tasks.register("runClientV1_21_$i", JavaExec) {
        dependsOn 'copyClientV1_21'
        group = 'minecraft'
        description = "Launch vanilla client 1.21.8 #$i"
        mainClass = 'net.minecraft.client.main.Main'
        classpath = files(vanillaClientV1_21)
        def playerName = randomPlayerName()
        args '--username', playerName,
                '--version', '1.21.8',
                '--accessToken', '0',
                '--gameDir', file("$buildDir/testclient-1.21-$i"),
                '--assetsDir', assetsDir,
                '--width', '854', '--height', '480',
                '--server', '127.0.0.1', '--port', '25565'
        jvmArgs '-Xmx1G'
    }
}

tasks.register('runClientsV1_21') {
    dependsOn runClientTasksV1_21
}